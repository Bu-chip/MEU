name: Sonda de artistas ocultos en title (probe, read-only)

# Mide qué cobertura tendrían los patrones que sacan al artista real de dentro
# del `title` (cuando el sello se acredita a sí mismo como `artist`). Solo LEE el
# canónico y produce un informe; lo sube como artifact para poder dispararlo y
# leerlo desde el iPad sin terminal. Fase de MEDICIÓN READ-ONLY: no extrae, no
# corrige, no escribe nada en el repo.
on:
  workflow_dispatch:

# Solo lectura del repo: el script LEE el canónico y escribe el informe en
# data/derived/, que viaja únicamente como artifact. Nada se commitea aquí.
permissions:
  contents: read

jobs:
  probe-titulos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El script usa solo la librería estándar (json, re, pathlib) y reutiliza
      # scripts/labels_index.py del propio repo: no hay deps que instalar. El paso
      # queda como gancho explícito por si en el futuro se añaden.
      - name: Instalar dependencias
        run: echo "Sin dependencias externas (solo stdlib)."

      - name: Medir artistas ocultos en title
        run: python3 scripts/probe_titulos.py

      - name: Subir informe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-titulos
          path: data/derived/probe_titulos.md
          if-no-files-found: error
