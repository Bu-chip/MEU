# Tests y guardias de datos. Corre en cada PR y en cada push a main. No
# despliega nada.
#
# Los PR de candidatos (ramas candidates/*) los empujan los robots
# discover-tags y discover-accounts con el GITHUB_TOKEN, y GitHub no
# dispara `pull_request` desde push hechos con ese token. Por eso los
# robots lanzan este workflow explícitamente con `gh workflow run
# tests.yml --ref <rama>` (workflow_dispatch SÍ se puede disparar con el
# GITHUB_TOKEN): el check queda sobre el head de la rama y aparece en el
# PR como cualquier otro.
#
# La guardia `locations.py check` falla si algún band_location de un
# fichero de candidatos del árbol no está registrado como observación en
# data/locations/observations/ (docs/mapa.md): así un merge futuro no
# puede volver a perder ubicaciones sin que se note.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un run por ref: si llegan dos runs seguidos sobre la misma rama (p. ej.
# dos pasadas del robot sobre el mismo PR de candidatos), el antiguo se
# cancela y el último es el que deja los checks.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tests de Python (capa de localización)
        run: python3 -m unittest discover -s tests -v

      - name: Guardia de ubicaciones
        run: python3 scripts/locations.py check

      # Los derivados (normalized, resolutions, auditoría, map_index) son
      # deterministas: regenerarlos no debe cambiar nada de lo commiteado.
      - name: Derivados de ubicación al día
        run: |
          python3 scripts/locations.py all
          git diff --exit-code -- data/locations docs/mapa-data-audit.md \
            || { echo "::error::derivados desactualizados: python3 scripts/locations.py all"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tests de la app (lógica del mapa)
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
