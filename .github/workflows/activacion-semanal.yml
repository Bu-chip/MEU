name: Mantenimiento diario de Supabase

# Tres lecturas mínimas al día (06:23, 14:23 y 22:23 UTC) generan actividad
# en la base compartida por MEU y genre-explorer. No garantizan evitar
# cualquier pausa del proyecto. Usa la misma clave anon que la web;
# RLS sigue aplicándose en el servidor. Sin checkout: no toca el repo.

on:
  schedule:
    - cron: "23 6,14,22 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Consulta mínima a Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Faltan los secretos VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          # Una lectura sobre la tabla de la colección (RLS puede devolver
          # [] sin sesión: no implica pérdida de datos). El cuerpo no se
          # imprime. Hasta dos reintentos solo ante fallos transitorios.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 30 \
            --retry 2 --retry-delay 5 --retry-max-time 100 \
            --retry-connrefused \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/saved_albums?select=disco_id&limit=1") || {
              CURL_EXIT=$?
              echo "::error::No se pudo completar la conexión con Supabase (curl $CURL_EXIT). Revisar red, TLS o disponibilidad; no confirma una pausa."
              exit 1
            }
          echo "respuesta: HTTP $CODE"
          case "$CODE" in
            2??) echo "Consulta mínima completada" ;;
            400) echo "::error::Error de consulta (HTTP $CODE). Revisar tabla, columnas y parámetros."; exit 1 ;;
            401|403) echo "::error::Error de autenticación o permisos (HTTP $CODE). Revisar configuración y permisos de acceso."; exit 1 ;;
            404) echo "::error::Ruta o recurso no encontrado (HTTP $CODE). Revisar URL y tabla."; exit 1 ;;
            408|429|5??) echo "::error::Fallo de disponibilidad o límite de solicitudes (HTTP $CODE); no confirma una pausa."; exit 1 ;;
            *) echo "::error::Respuesta inesperada de Supabase (HTTP $CODE). Revisar la configuración y el estado del servicio."; exit 1 ;;
          esac
